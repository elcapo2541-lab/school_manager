{% extends "base.html" %}

{% block title %}{{ title }} · School Manager{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="field">
                {{ field.label_tag }} {{ field }} {{ field.errors }}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit">Enregistrer</button>
            <a class="btn btn-link" href="{% url 'teachers:list' %}">Annuler</a>
        </div>
    </form>
{% endblock %}
