{% extends "base.html" %}

{% block title %}Supprimer {{ student }}{% endblock %}

{% block content %}
    <h1>Supprimer {{ student }} ?</h1>
    <form method="post">
        {% csrf_token %}
        <p class="warn">⚠ Cette action est définitive : la fiche sera effacée de la base.</p>
        <div class="form-actions">
            <button type="submit" class="btn-danger">Oui, supprimer</button>
            <a class="btn btn-link" href="{% url 'students:detail' student.id %}">Annuler</a>
        </div>
    </form>
{% endblock %}
